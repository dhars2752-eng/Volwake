name: Build Volume Wake APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/volwake app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VolWake"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.volwake"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.volwake"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VolService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Volume Wake</string>
          </resources>
          EOF

          cat > app/src/main/java/com/example/volwake/MainActivity.kt <<'EOF'
          package com.example.volwake

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, VolService::class.java))
                  val tv = TextView(this)
                  tv.text = "Volume Wake is running.\nTurn the screen off and press Volume Down.\nYou can close this app."
                  tv.textSize = 18f
                  tv.setPadding(48, 96, 48, 48)
                  setContentView(tv)
              }
          }
          EOF

          cat > app/src/main/java/com/example/volwake/VolService.kt <<'EOF'
          package com.example.volwake

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import android.media.VolumeProvider
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          class VolService : Service() {

              private lateinit var session: MediaSession
              private var track: AudioTrack? = null

              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> activate()
                          Intent.ACTION_SCREEN_ON -> deactivate()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()

                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("vw", "Volume Wake", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "vw")
                      .setContentTitle("Volume Wake is on")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } else {
                      startForeground(1, n)
                  }

                  session = MediaSession(this, "volwake")
                  session.setPlaybackToRemote(object : VolumeProvider(VOLUME_CONTROL_RELATIVE, 100, 50) {
                      override fun onAdjustVolume(direction: Int) {
                          val pm = getSystemService(POWER_SERVICE) as PowerManager
                          if (!pm.isInteractive) {
                              if (direction < 0) wake()
                          }
                      }
                  })

                  registerReceiver(screenReceiver, IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_SCREEN_ON)
                  })

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  if (!pm.isInteractive) activate()
              }

              private fun wake() {
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  @Suppress("DEPRECATION")
                  pm.newWakeLock(
                      PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                      "volwake:wake"
                  ).acquire(3000)
              }

              private fun activate() {
                  if (track != null) return
                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()
                  val fmt = AudioFormat.Builder()
                      .setSampleRate(44100)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()
                  val size = AudioTrack.getMinBufferSize(
                      44100, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val t = AudioTrack(attrs, fmt, size, AudioTrack.MODE_STREAM, AudioManager.AUDIO_SESSION_ID_GENERATE)
                  t.play()
                  track = t
                  Thread {
                      val buf = ShortArray(size / 2)
                      try {
                          while (track === t) {
                              if (t.write(buf, 0, buf.size) < 0) break
                          }
                      } catch (e: Exception) {
                      }
                  }.start()

                  session.setPlaybackState(
                      PlaybackState.Builder()
                          .setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE)
                          .setState(PlaybackState.STATE_PLAYING, 0, 1f)
                          .build()
                  )
                  session.isActive = true
              }

              private fun deactivate() {
                  session.isActive = false
                  val t = track ?: return
                  track = null
                  try {
                      t.stop()
                      t.release()
                  } catch (e: Exception) {
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int) = START_STICKY

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  unregisterReceiver(screenReceiver)
                  deactivate()
                  session.release()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Volume Wake build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
