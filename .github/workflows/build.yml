name: Build Volume Wake APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/volwake app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VolWake"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.volwake"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.volwake"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WakeService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Volume Wake</string>
              <string name="service_desc">Turns the screen on when you press Volume Down.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/service_desc" />
          EOF

          cat > app/src/main/java/com/example/volwake/MainActivity.kt <<'EOF'
          package com.example.volwake

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  finish()
              }
          }
          EOF

          cat > app/src/main/java/com/example/volwake/WakeService.kt <<'EOF'
          package com.example.volwake

          import android.accessibilityservice.AccessibilityService
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent

          class WakeService : AccessibilityService() {

              @Suppress("DEPRECATION")
              private fun buzz() {
                  val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                  v.vibrate(VibrationEffect.createOneShot(200, VibrationEffect.DEFAULT_AMPLITUDE))
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN) {
                      buzz() // TEST: proves the phone delivered the button press
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isInteractive) {
                          @Suppress("DEPRECATION")
                          pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "volwake:wake"
                          ).acquire(3000)
                          return true
                      }
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Volume Wake build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
